{% set name = "antlr4-python3-runtime" %}
{% set version = "4.13.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 909b647e1d2fc2b70180ac586df3933e38919c85f98ccc656a96cd3f25ef3916

build:
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation  --ignore-installed --no-cache-dir -vvv
  entry_points:
    - pygrun=antlr4._pygrun:main

requirements:
  host:
    - pip
    - python
    - setuptools >=61.2,<82
    - wheel 
  run:
    - python
    - typing  # [py<35]
  run_constrained:
    - setuptools <82

test:
  imports:
    - antlr4
    - antlr4.atn
    - antlr4.dfa
    - antlr4.error
    - antlr4.tree
    - antlr4.xpath
  commands:
    - pip check
    - pygrun -h
  requires:
    - pip

about:
  home: https://www.antlr.org/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Python runtime for ANTLR.
  description: Runtime library for ANTLR4 that is specifically designed for use with the Python 3 programming language.
  dev_url: https://github.com/antlr/antlr4
  doc_url: https://github.com/antlr/antlr4/blob/master/doc/python-target.md

extra:
  recipe-maintainers:
    - agonopol
